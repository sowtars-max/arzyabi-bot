name: arzyabi-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "شروع اجباری (برای آپدیت فوری کد؛ محافظت از دو شروع همزمان را غیرفعال می‌کند)"
        type: boolean
        default: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    concurrency:
      group: arzyabi-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        run: pip install -r requirements.txt

      - name: دریافت وضعیت قبلی
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bot-state
          path: data

      - name: دریافت قفل
        id: dllock
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: keepalive-lock
          path: lockdir

      - name: انتخابات (آیا نمونه‌ی دیگری در حال اجراست؟)
        id: election
        run: |
          NOW=$(date +%s)
          if [ -f lockdir/timestamp ]; then
            LAST=$(cat lockdir/timestamp)
            AGE=$((NOW - LAST))
            if [ "$AGE" -lt 20400 ]; then
              echo "🟢 نمونه‌ی دیگری در حال اجراست (سن: ${AGE} ثانیه) — این دور رد می‌شود"
              echo "out=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "out=false" >> "$GITHUB_OUTPUT"

      - name: گرفتن قفل
        if: ${{ steps.election.outputs.out != 'true' || github.event.inputs.force == 'true' }}
        run: |
          mkdir -p lockdir
          date +%s > lockdir/timestamp

      - name: ثبت قفل
        if: ${{ steps.election.outputs.out != 'true' || github.event.inputs.force == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-lock
          path: lockdir

      - name: اجرای ربات (۵ ساعت و ۴۵ دقیقه)
        if: ${{ steps.election.outputs.out != 'true' || github.event.inputs.force == 'true' }}
        env:
          TZ: Asia/Tehran
          EXIT_AFTER_MINUTES: "345"
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          CHANNEL_USERNAME: Arzyabi_eam
        run: timeout -s TERM 350m python bot.py

      - name: ذخیره وضعیت
        if: always() && ${{ steps.election.outputs.out != 'true' || github.event.inputs.force == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: bot-state
          path: data
          if-no-files-found: ignore
